<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Tết 2027</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #8b0000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 1s ease;
            overflow: hidden;
        }
        
        body.dark-mode { background-color: #000000 !important; }
        
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        #countdown { font-size: 5rem; font-weight: bold; color: #ffffff; text-shadow: 0 0 20px #ff0000; }
        
        #fireworksCanvas { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 99; 
        }

        #sound-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(139, 0, 0, 0.98); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #sound-overlay h2 { font-size: 1.8rem; color: #ffd700; margin-bottom: 20px; text-align: center; padding: 0 20px; }
        #sound-overlay button {
            padding: 15px 35px; font-size: 1.3rem; font-weight: bold;
            background-color: #28a745; color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .control-panel {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffd700;
            border-radius: 10px; padding: 15px; color: #fff; z-index: 1000; text-align: left;
        }
        .control-panel button { padding: 8px 12px; margin-top: 5px; border-radius: 5px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-test { background-color: #28a745; color: white; }
        .btn-reset { background-color: #dc3545; color: white; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="sound-overlay">
        <h2>🔊 BẤM VÀO ĐÂY ĐỂ BẬT ÂM THANH & VÀO WEB 🔊</h2>
        <button onclick="enableSound()">Vào Web Ngay</button>
    </div>

    <h1>ĐẾM NGƯỢC TẾT ĐINH MÙI 2027</h1>
    <div id="countdown">Đang tải...</div>

    <canvas id="fireworksCanvas"></canvas>

    <div class="control-panel">
        <h3 style="color: #ffd700; font-size: 1rem;">Bảng Thử Nghiệm</h3>
        <button class="btn-test" onclick="testCountdown()">▶ Test Ngay</button>
        <button class="btn-reset" onclick="resetTest()">Reset</button>
    </div>

    <audio id="tetAudio" src="/static/tet.mp3" preload="auto"></audio>

    <script>
        let targetTime = new Date("2027-02-06T00:00:00").getTime();
        
        const tetAudio = document.getElementById("tetAudio");
        const countdownEl = document.getElementById("countdown");
        
        let soundAllowed = false;
        let isTesting = false;
        let fireworksStarted = false;

        function enableSound() {
            document.getElementById("sound-overlay").style.display = "none";
            soundAllowed = true;
            tetAudio.play().then(() => { tetAudio.pause(); tetAudio.currentTime = 0; }).catch(e => {});
        }

        function updateTimer() {
            if (!soundAllowed) return;

            let now = new Date().getTime();
            let distance = targetTime - now;

            // Nếu đang chạy test hoặc đến giờ giao thừa
            if (isTesting) {
                // Khi file tetAudio đang chạy, ta có thể căn cứ vào currentTime của nó để đổi số trên màn hình cho KHỚP TUYỆT ĐỐI
                // Giả sử file tet.mp3 của ông dài X giây, đoạn đếm ngược 5-4-3-2-1 nằm ở cuối file. 
                // Cách an toàn nhất khi dùng đúng 1 file audio có sẵn giọng đọc là hiển thị thời gian thực bình thường, 
                // nhưng vào 10 giây cuối thì ép đồng hồ đếm lùi chuẩn theo giây của audio.
            }

            if (distance <= 0) {
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
                document.body.classList.add("dark-mode");
                if (!fireworksStarted) {
                    fireworksStarted = true;
                    startFireworks();
                }
                return;
            }

            let seconds = Math.floor(distance / 1000);

            // Khi còn 10 giây cuối -> Bắt đầu phát file tetAudio và hiển thị đếm ngược bám sát thời gian thực
            let triggerSecs = 10; // Thay đổi số này nếu file tet.mp3 của ông dài hơn hoặc ngắn hơn
            
            if (seconds <= 10 && seconds > 0) {
                document.body.classList.add("dark-mode");
                countdownEl.innerText = seconds; // Hiển thị chuẩn xác từng giây không lệch
                
                if (tetAudio.paused && !isTesting) {
                    tetAudio.currentTime = 0;
                    tetAudio.play().catch(e => {});
                    isTesting = true;
                }
            } else if (seconds > 10) {
                let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let secs = Math.floor((distance % (1000 * 60)) / 1000);
                countdownEl.innerText = `${hours}h ${minutes}m ${secs}s`;
            }
        }

        setInterval(updateTimer, 200);

        function testCountdown() {
            soundAllowed = true;
            document.getElementById("sound-overlay").style.display = "none";
            
            // Chạy thử ngay 10 giây cuối để test khớp hình và tiếng
            targetTime = new Date().getTime() + 10500; 
            isTesting = true;
            fireworksStarted = false;
            document.body.classList.remove("dark-mode");
            
            tetAudio.currentTime = 0;
            tetAudio.play().catch(e => console.log("Lỗi phát audio"));
            particles = [];
        }

        function resetTest() {
            targetTime = new Date("2027-02-06T00:00:00").getTime();
            isTesting = false;
            fireworksStarted = false;
            document.body.classList.remove("dark-mode");
            tetAudio.pause(); 
            tetAudio.currentTime = 0;
            countdownEl.innerText = "Đang tải...";
            particles = [];
        }

        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startFireworks() {
            setInterval(() => {
                let x = Math.random() * canvas.width;
                let y = Math.random() * (canvas.height / 2);
                createFirework(x, y);
            }, 250);
            animateFireworks();
        }

        function createFirework(x, y) {
            let count = 60;
            for (let i = 0; i < count; i++) {
                let angle = (Math.PI * 2 / count) * i;
                let speed = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();

                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }
    </script>
</body>
</html>
