<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Tết Đinh Mùi 2027</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Pacifico&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle, #b70909 0%, #4a0000 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1s ease;
            overflow: hidden;
            position: relative;
        }

        body.dark-mode {
            background: #020208 !important;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 2px 2px 4px #000;
            letter-spacing: 2px;
        }

        #countdown {
            font-size: 6rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px #ff0000, 0 0 10px #ffd700;
            margin: 20px 0;
            transition: transform 0.2s ease;
        }

        .tet-wish {
            font-family: 'Pacifico', cursive;
            font-size: 3.5rem !important;
            color: #ffd700 !important;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ffd700 !important;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        #fireworksCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 99;
        }

        #sound-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(139, 0, 0, 0.98); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #sound-overlay h2 { font-size: 2rem; color: #ffd700; margin-bottom: 25px; text-shadow: 0 0 10px #000; text-align: center; padding: 0 20px; }
        #sound-overlay button {
            padding: 18px 45px; font-size: 1.4rem; font-weight: bold;
            background: linear-gradient(135deg, #ff8c00, #e52d27);
            color: white; border: 2px solid #ffd700; border-radius: 50px;
            cursor: pointer; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .control-panel {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffd700;
            border-radius: 12px; padding: 12px 18px; color: #fff; z-index: 1000; text-align: left;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        .control-panel button { padding: 8px 14px; margin-top: 5px; border-radius: 6px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-test { background-color: #28a745; color: white; }
        .btn-reset { background-color: #dc3545; color: white; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="sound-overlay">
        <h2>🎆 CHÀO MỪNG ĐẾN VỚI ĐẾM NGƯỢC TẾT 2027 🎆</h2>
        <button onclick="enableSound()">🔔 BẬT ÂM THANH & VÀO WEB 🔔</button>
    </div>

    <h1>ĐẾM NGƯỢC TẾT ĐINH MÙI 2027</h1>
    <div id="countdown">Đang tải...</div>

    <canvas id="fireworksCanvas"></canvas>

    <div class="control-panel">
        <h3 style="color: #ffd700; font-size: 0.9rem;">Bảng Thử Nghiệm</h3>
        <button class="btn-test" onclick="testCountdown()">▶ Test Ngay</button>
        <button class="btn-reset" onclick="resetTest()">Reset</button>
    </div>

    <audio id="tetAudio" src="/static/tet.mp3" preload="auto"></audio>

    <script>
        let targetTime = new Date("2027-02-06T00:00:00").getTime();
        
        const tetAudio = document.getElementById("tetAudio");
        const countdownEl = document.getElementById("countdown");
        
        let soundAllowed = false;
        let isTesting = false;
        let fireworksStarted = false;

        function enableSound() {
            document.getElementById("sound-overlay").style.display = "none";
            soundAllowed = true;
            tetAudio.play().then(() => { tetAudio.pause(); tetAudio.currentTime = 0; }).catch(e => {});
        }

        // Bám sát thời gian thực của file tet.mp3 để hiển thị chữ Đếm Ngược -> Hiện Chúc Mừng
        tetAudio.ontimeupdate = function() {
            if (!isTesting && !soundAllowed) return;
            
            let t = tetAudio.currentTime;

            if (t < 2.5) {
                document.body.classList.add("dark-mode");
                countdownEl.className = "";
                countdownEl.innerText = "Sẵn sàng...";
            } else if (t >= 2.5 && t < 3.5) {
                countdownEl.innerText = "5";
            } else if (t >= 3.5 && t < 4.5) {
                countdownEl.innerText = "4";
            } else if (t >= 4.5 && t < 5.5) {
                countdownEl.innerText = "3";
            } else if (t >= 5.5 && t < 6.5) {
                countdownEl.innerText = "2";
            } else if (t >= 6.5 && t < 7.5) {
                countdownEl.innerText = "1";
            } else if (t >= 7.5) {
                // ĐOẠN ĐANG ĐỌC CÂU CHÚC -> HIỆN CHỮ CHÚC MỪNG LỚN NHƯNG CHƯA NỔ PHÁO HOA
                countdownEl.className = "tet-wish";
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
            }
        };

        // KHI VỪA ĐỌC XONG HẲN CÂU CHÚC (HẾT FILE tet.mp3) -> BÙNG NỔ PHÁO HOA VÀ NHẠC TẾT TƯNG BỪNG!
        tetAudio.onended = function() {
            if (!fireworksStarted) {
                fireworksStarted = true;
                countdownEl.className = "tet-wish";
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI 2027!";
                document.body.classList.add("dark-mode");
                startFireworks();
            }
        };

        function updateTimer() {
            if (!soundAllowed || isTesting) return;

            let now = new Date().getTime();
            let distance = targetTime - now;

            if (distance <= 0) {
                countdownEl.className = "tet-wish";
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
                document.body.classList.add("dark-mode");
                if (!fireworksStarted && tetAudio.paused) {
                    tetAudio.currentTime = 0;
                    tetAudio.play().catch(e => {});
                    isTesting = true;
                }
                return;
            }

            let seconds = Math.floor(distance / 1000);
            
            if (seconds <= 12) {
                document.body.classList.add("dark-mode");
                if (tetAudio.paused) {
                    tetAudio.currentTime = 0;
                    tetAudio.play().catch(e => {});
                    isTesting = true;
                }
            } else {
                let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let secs = Math.floor((distance % (1000 * 60)) / 1000);
                countdownEl.className = "";
                countdownEl.innerText = `${hours}h ${minutes}m ${secs}s`;
            }
        }

        setInterval(updateTimer, 200);

        function testCountdown() {
            soundAllowed = true;
            document.getElementById("sound-overlay").style.display = "none";
            
            isTesting = true;
            fireworksStarted = false;
            document.body.classList.add("dark-mode");
            
            tetAudio.currentTime = 0;
            tetAudio.play().catch(e => console.log("Lỗi phát audio"));
            fireworksList = [];
            particlesList = [];
        }

        function resetTest() {
            targetTime = new Date("2027-02-06T00:00:00").getTime();
            isTesting = false;
            fireworksStarted = false;
            document.body.classList.remove("dark-mode");
            tetAudio.pause(); 
            tetAudio.currentTime = 0;
            countdownEl.className = "";
            countdownEl.innerText = "Đang tải...";
            fireworksList = [];
            particlesList = [];
        }

        /* --- PHÁO HOA XỊN XÒ NÂNG CẤP --- */
        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");
        let fireworksList = [];
        let particlesList = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height * 0.4) + canvas.height * 0.1;
                this.speed = Math.random() * 4 + 7;
                this.angle = Math.PI / 2 + (Math.random() - 0.5) * 0.2;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = -Math.sin(this.angle) * this.speed;
                this.hue = Math.random() * 360;
                this.exploded = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.vy < 0 && this.y <= this.targetY) {
                    this.exploded = true;
                    createParticles(this.x, this.y, this.hue);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 8 + 1;
                this.friction = 0.95;
                this.gravity = 0.12;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.hue = hue + (Math.random() - 0.5) * 20;
                this.alpha = 1;
                this.decay = Math.random() * 0.018 + 0.01;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticles(x, y, hue) {
            let count = 90;
            for (let i = 0; i < count; i++) {
                particlesList.push(new Particle(x, y, hue));
            }
        }

        let fireworkTimer = 0;
        function startFireworks() {
            animateFireworks();
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = 'rgba(2, 2, 8, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (fireworksStarted) {
                fireworkTimer++;
                if (fireworkTimer % 12 === 0) {
                    fireworksList.push(new Firework());
                }
            }

            for (let i = fireworksList.length - 1; i >= 0; i--) {
                fireworksList[i].update();
                fireworksList[i].draw();
                if (fireworksList[i].exploded) {
                    fireworksList.splice(i, 1);
                }
            }

            for (let i = particlesList.length - 1; i >= 0; i--) {
                particlesList[i].update();
                particlesList[i].draw();
                if (particlesList[i].alpha <= 0) {
                    particlesList.splice(i, 1);
                }
            }
        }
    </script>
</body>
</html>
