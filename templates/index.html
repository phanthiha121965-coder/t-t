<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Tết 2027</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #8b0000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 1s ease;
            overflow: hidden;
        }
        
        body.dark-mode { background-color: #000000 !important; }
        
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        #countdown { font-size: 5rem; font-weight: bold; color: #ffffff; text-shadow: 0 0 20px #ff0000; }
        
        #fireworksCanvas { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 99; 
        }

        .control-panel {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffd700;
            border-radius: 10px; padding: 15px; color: #fff; z-index: 1000; text-align: left;
        }
        .control-panel button { padding: 8px 12px; margin-top: 5px; border-radius: 5px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-test { background-color: #28a745; color: white; }
        .btn-test:hover { background-color: #218838; }
        .btn-reset { background-color: #dc3545; color: white; margin-left: 5px; }
        .btn-reset:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <h1>ĐẾM NGƯỢC TẾT ĐINH MÙI 2027</h1>
    <div id="countdown">Đang tải...</div>

    <canvas id="fireworksCanvas"></canvas>

    <!-- Bảng Thử Nghiệm Nhanh -->
    <div class="control-panel">
        <h3 style="color: #ffd700; font-size: 1rem;">Bảng Thử Nghiệm</h3>
        <p style="margin-top: 3px; font-size: 0.75rem;">Test hiệu ứng âm thanh & pháo hoa:</p>
        <button class="btn-test" onclick="testCountdown()">▶ Test Ngay</button>
        <button class="btn-reset" onclick="resetTest()">Reset</button>
    </div>

    <!-- Thẻ audio chính và pháo hoa -->
    <audio id="mainAudio" preload="auto"></audio>
    <audio id="fireworksAudio" src="/static/nhac_tet.mp3" preload="auto"></audio>

    <script>
        let targetTime = new Date("2027-02-06T00:00:00").getTime();
        
        const mainAudio = document.getElementById("mainAudio");
        const fireworksAudio = document.getElementById("fireworksAudio");
        const countdownEl = document.getElementById("countdown");
        
        let preparationPlayed = false;
        let countdownPlayed = false;
        let greetingPlayed = false;
        let fireworksTriggered = false;

        function updateTimer() {
            let now = new Date().getTime();
            let distance = targetTime - now;

            if (distance <= 0) {
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
                document.body.classList.add("dark-mode");
                return;
            }

            let seconds = Math.floor(distance / 1000);

            // 1. Khi đồng hồ còn 11 giây -> Bắt đầu phát câu chuẩn bị ("Chuẩn bị sẵn sàng chưa...")[span_1](start_span)[span_1](end_span)
            if (seconds === 11 && !preparationPlayed) {
                preparationPlayed = true;
                mainAudio.src = "/static/chuan_bi.mp3";
                mainAudio.playbackRate = 1.0;
                mainAudio.play().catch(e => console.log("Cần click trang web để phát âm thanh"));
            }

            // 2. Khi đồng hồ chuyển chính xác về 5 giây -> Ép chuyển sang phát file đếm ngược ("5, 4, 3, 2, 1")[span_2](start_span)[span_2](end_span)
            if (seconds === 5 && !countdownPlayed) {
                countdownPlayed = true;
                mainAudio.src = "/static/dem_nguoc.mp3";
                mainAudio.playbackRate = 0.7; // Chỉnh tốc độ chậm rãi khớp nhịp đếm
                mainAudio.play().catch(e => console.log("Lỗi file đếm ngược"));
            }

            // 3. Khi đồng hồ về 0 giây -> Phát câu chúc Tết ("Một năm mới bình an")[span_3](start_span)[span_3](end_span)
            if (seconds === 0 && !greetingPlayed) {
                greetingPlayed = true;
                mainAudio.src = "/static/chuc_tet.mp3";
                mainAudio.playbackRate = 1.0;
                mainAudio.play().catch(e => console.log("Lỗi file chúc tết"));

                // Khi câu chúc đọc xong -> Bật nhạc pháo hoa và bắn pháo hoa
                mainAudio.onended = function() {
                    if (!fireworksTriggered) {
                        fireworksTriggered = true;
                        fireworksAudio.currentTime = 0;
                        fireworksAudio.play().catch(e => console.log("Lỗi phát nhạc pháo hoa"));
                        startFireworks();
                    }
                };
            }

            // Hiển thị giao diện trên màn hình
            if (seconds <= 5) {
                countdownEl.innerText = seconds;
                document.body.classList.add("dark-mode");
            } else {
                let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let secs = Math.floor((distance % (1000 * 60)) / 1000);
                countdownEl.innerText = `${hours}h ${minutes}m ${secs}s`;
            }
        }

        setInterval(updateTimer, 200); // Quét nhanh 200ms một lần để bắt chuẩn từng giây chính xác tuyệt đối

        function testCountdown() {
            // Test thử lùi về 12 giây trước mốc 0 để chạy trọn vẹn chuỗi âm thanh
            targetTime = new Date().getTime() + 12000;
            preparationPlayed = false;
            countdownPlayed = false;
            greetingPlayed = false;
            fireworksTriggered = false;
            document.body.classList.remove("dark-mode");
            mainAudio.pause(); mainAudio.currentTime = 0;
            fireworksAudio.pause(); fireworksAudio.currentTime = 0;
            countdownEl.innerText = "Đang chuẩn bị...";
        }

        function resetTest() {
            targetTime = new Date("2027-02-06T00:00:00").getTime();
            preparationPlayed = false;
            countdownPlayed = false;
            greetingPlayed = false;
            fireworksTriggered = false;
            document.body.classList.remove("dark-mode");
            mainAudio.pause(); mainAudio.currentTime = 0;
            fireworksAudio.pause(); fireworksAudio.currentTime = 0;
            countdownEl.innerText = "Đang tải...";
        }

        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startFireworks() {
            setInterval(() => {
                let x = Math.random() * canvas.width;
                let y = Math.random() * (canvas.height / 2);
                createFirework(x, y);
            }, 250);
            animateFireworks();
        }

        function createFirework(x, y) {
            let count = 60;
            for (let i = 0; i < count; i++) {
                let angle = (Math.PI * 2 / count) * i;
                let speed = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();

                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }
    </script>
</body>
</html>
