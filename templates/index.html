<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Tết 2027</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #8b0000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 1s ease;
            overflow: hidden;
        }
        
        body.dark-mode { background-color: #000000 !important; }
        
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        #countdown { font-size: 5rem; font-weight: bold; color: #ffffff; text-shadow: 0 0 20px #ff0000; }
        
        #fireworksCanvas { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 99; 
        }

        .control-panel {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffd700;
            border-radius: 10px; padding: 15px; color: #fff; z-index: 1000; text-align: left;
        }
        .control-panel button { padding: 8px 12px; margin-top: 5px; border-radius: 5px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-test { background-color: #28a745; color: white; }
        .btn-test:hover { background-color: #218838; }
        .btn-reset { background-color: #dc3545; color: white; margin-left: 5px; }
        .btn-reset:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <h1>ĐẾM NGƯỢC TẾT ĐINH MÙI 2027</h1>
    <div id="countdown">Đang tải...</div>

    <canvas id="fireworksCanvas"></canvas>

    <!-- Bảng Thử Nghiệm Nhanh -->
    <div class="control-panel">
        <h3 style="color: #ffd700; font-size: 1rem;">Bảng Thử Nghiệm</h3>
        <p style="margin-top: 3px; font-size: 0.75rem;">Test hiệu ứng âm thanh & pháo hoa:</p>
        <button class="btn-test" onclick="testCountdown()">▶ Test Ngay</button>
        <button class="btn-reset" onclick="resetTest()">Reset</button>
    </div>

    <!-- Sử dụng lại file tet.mp3 gộp chung chuẩn chỉnh ban đầu + nhạc pháo hoa -->
    <audio id="tetAudio" src="/static/tet.mp3" preload="auto"></audio>
    <audio id="fireworksAudio" src="/static/nhac_tet.mp3" preload="auto"></audio>

    <script>
        let targetTime = new Date("2027-02-06T00:00:00").getTime();
        
        const tetAudio = document.getElementById("tetAudio");
        const fireworksAudio = document.getElementById("fireworksAudio");
        const countdownEl = document.getElementById("countdown");
        
        let audioPlayed = false;
        let fireworksTriggered = false;

        // Khi file tetAudio (chứa lời dạo + đếm ngược + câu chúc) chạy xong hoàn toàn -> Bật nhạc pháo hoa và bắn pháo hoa rợp trời!
        tetAudio.onended = function() {
            if (!fireworksTriggered) {
                fireworksTriggered = true;
                fireworksAudio.currentTime = 0;
                fireworksAudio.play().catch(e => console.log("Lỗi phát nhạc pháo hoa"));
                startFireworks();
            }
        };

        function updateTimer() {
            let now = new Date().getTime();
            let distance = targetTime - now;

            // Kích hoạt phát file tetAudio trước mốc 0 một khoảng thời gian vừa đúng độ dài của file âm thanh (ví dụ 10 giây cuối)
            let triggerPoint = 10000; 

            if (distance <= triggerPoint && distance > 0 && !audioPlayed) {
                audioPlayed = true;
                tetAudio.currentTime = 0;
                tetAudio.playbackRate = 1.0;
                tetAudio.play().catch(e => console.log("Cần click trang web để phát âm thanh"));
            }

            // Khi vào 5 giây cuối -> Chuyển màn hình sang nền đen
            if (distance <= 5000 && distance > 0) {
                document.body.classList.add("dark-mode");
            }

            // Khi đến mốc 0 giây
            if (distance <= 0) {
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
                return; // Chờ file tetAudio đọc xong câu chúc thì sự kiện onended ở trên sẽ tự động kích hoạt pháo hoa
            }

            let seconds = Math.floor(distance / 1000);
            if (seconds <= 5) {
                countdownEl.innerText = seconds; 
            } else {
                let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let secs = Math.floor((distance % (1000 * 60)) / 1000);
                countdownEl.innerText = `${hours}h ${minutes}m ${secs}s`;
            }
        }

        setInterval(updateTimer, 1000);

        function testCountdown() {
            targetTime = new Date().getTime() + 10000;
            audioPlayed = false;
            fireworksTriggered = false;
            document.body.classList.remove("dark-mode");
            tetAudio.pause(); tetAudio.currentTime = 0;
            fireworksAudio.pause(); fireworksAudio.currentTime = 0;
            countdownEl.innerText = "Đang chuẩn bị...";
        }

        function resetTest() {
            targetTime = new Date("2027-02-06T00:00:00").getTime();
            audioPlayed = false;
            fireworksTriggered = false;
            document.body.classList.remove("dark-mode");
            tetAudio.pause(); tetAudio.currentTime = 0;
            fireworksAudio.pause(); fireworksAudio.currentTime = 0;
            countdownEl.innerText = "Đang tải...";
        }

        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startFireworks() {
            setInterval(() => {
                let x = Math.random() * canvas.width;
                let y = Math.random() * (canvas.height / 2);
                createFirework(x, y);
            }, 250);
            animateFireworks();
        }

        function createFirework(x, y) {
            let count = 60;
            for (let i = 0; i < count; i++) {
                let angle = (Math.PI * 2 / count) * i;
                let speed = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();

                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }
    </script>
</body>
</html>
