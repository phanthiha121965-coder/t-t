<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Tết 2027</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #8b0000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 1s ease;
            overflow: hidden;
        }
        
        body.dark-mode { background-color: #000000 !important; }
        
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ffd700; text-shadow: 2px 2px 4px #000; }
        #countdown { font-size: 5rem; font-weight: bold; color: #ffffff; text-shadow: 0 0 20px #ff0000; }
        
        #fireworksCanvas { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            pointer-events: none; z-index: 99; 
        }

        /* Nút mở khóa âm thanh chống trình duyệt chặn */
        #sound-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(139, 0, 0, 0.98); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #sound-overlay h2 { font-size: 1.8rem; color: #ffd700; margin-bottom: 20px; text-align: center; padding: 0 20px; }
        #sound-overlay button {
            padding: 15px 35px; font-size: 1.3rem; font-weight: bold;
            background-color: #28a745; color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .control-panel {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffd700;
            border-radius: 10px; padding: 15px; color: #fff; z-index: 1000; text-align: left;
        }
        .control-panel button { padding: 8px 12px; margin-top: 5px; border-radius: 5px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-test { background-color: #28a745; color: white; }
        .btn-reset { background-color: #dc3545; color: white; margin-left: 5px; }
    </style>
</head>
<body>

    <!-- Bảng bấm mở khóa âm thanh -->
    <div id="sound-overlay">
        <h2>🔊 BẤM VÀO ĐÂY ĐỂ BẬT ÂM THANH & VÀO WEB 🔊</h2>
        <button onclick="enableSound()">Vào Web Ngay</button>
    </div>

    <h1>ĐẾM NGƯỢC TẾT ĐINH MÙI 2027</h1>
    <div id="countdown">Đang tải...</div>

    <canvas id="fireworksCanvas"></canvas>

    <!-- Bảng Thử Nghiệm Nhanh -->
    <div class="control-panel">
        <h3 style="color: #ffd700; font-size: 1rem;">Bảng Thử Nghiệm</h3>
        <button class="btn-test" onclick="testCountdown()">▶ Test Ngay</button>
        <button class="btn-reset" onclick="resetTest()">Reset</button>
    </div>

    <!-- Gọi đúng tên 3 file âm thanh đã cắt + nhạc pháo hoa -->
    <audio id="mainAudio" preload="auto"></audio>
    <audio id="fireworksAudio" src="/static/nhac_tet.mp3" preload="auto"></audio>

    <script>
        let targetTime = new Date("2027-02-06T00:00:00").getTime();
        
        const mainAudio = document.getElementById("mainAudio");
        const fireworksAudio = document.getElementById("fireworksAudio");
        const countdownEl = document.getElementById("countdown");
        
        let soundAllowed = false;
        let audioState = 0; // 0: chưa chạy, 1: đang chạy chuẩn bị, 2: đang đếm ngược, 3: đang chúc tết
        let fireworksTriggered = false;

        function enableSound() {
            document.getElementById("sound-overlay").style.display = "none";
            soundAllowed = true;
            
            // Mở khóa audio cho trình duyệt
            mainAudio.play().then(() => { mainAudio.pause(); mainAudio.currentTime = 0; }).catch(e => {});
            fireworksAudio.play().then(() => { fireworksAudio.pause(); fireworksAudio.currentTime = 0; }).catch(e => {});
        }

        // Xử lý chuỗi phát nối tiếp 3 file âm thanh tự động hoàn hảo
        mainAudio.onended = function() {
            if (audioState === 1) {
                // Hết chuan_bi.mp3 -> Chuyển sang dem_nguoc.mp3
                audioState = 2;
                mainAudio.src = "/static/dem_nguoc.mp3";
                mainAudio.playbackRate = 0.7; // Đọc chậm rãi khớp nhịp đếm
                mainAudio.play().catch(e => console.log("Lỗi dem_nguoc"));
            } else if (audioState === 2) {
                // Hết dem_nguoc.mp3 -> Chuyển sang chuc_tet.mp3
                audioState = 3;
                mainAudio.src = "/static/chuc_tet.mp3";
                mainAudio.playbackRate = 1.0;
                mainAudio.play().catch(e => console.log("Lỗi chuc_tet"));
            } else if (audioState === 3) {
                // Đọc xong câu chúc -> Bật nhạc pháo hoa và bắn pháo hoa tưng bừng!
                if (!fireworksTriggered) {
                    fireworksTriggered = true;
                    fireworksAudio.currentTime = 0;
                    fireworksAudio.play().catch(e => console.log("Lỗi nhạc pháo hoa"));
                    startFireworks();
                }
            }
        };

        function updateTimer() {
            if (!soundAllowed) return;

            let now = new Date().getTime();
            let distance = targetTime - now;
            let triggerPoint = 10000; 

            // Bắt đầu phát file đầu tiên (chuan_bi.mp3)[span_1](start_span)[span_1](end_span)
            if (distance <= triggerPoint && distance > 0 && audioState === 0) {
                audioState = 1;
                mainAudio.src = "/static/chuan_bi.mp3";
                mainAudio.playbackRate = 1.0;
                mainAudio.play().catch(e => console.log("Lỗi phát chuan_bi"));
            }

            if (distance <= 5000 && distance > 0) {
                document.body.classList.add("dark-mode");
            }

            if (distance <= 0) {
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
                return;
            }

            let seconds = Math.floor(distance / 1000);
            if (seconds <= 5) {
                countdownEl.innerText = seconds; 
            } else {
                let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let secs = Math.floor((distance % (1000 * 60)) / 1000);
                countdownEl.innerText = `${hours}h ${minutes}m ${secs}s`;
            }
        }

        setInterval(updateTimer, 1000);

        function testCountdown() {
            soundAllowed = true;
            document.getElementById("sound-overlay").style.display = "none";
            targetTime = new Date().getTime() + 10000;
            audioState = 0;
            fireworksTriggered = false;
            document.body.classList.remove("dark-mode");
            mainAudio.pause(); mainAudio.currentTime = 0;
            fireworksAudio.pause(); fireworksAudio.currentTime = 0;
            countdownEl.innerText = "Đang chuẩn bị...";
        }

        function resetTest() {
            targetTime = new Date("2027-02-06T00:00:00").getTime();
            audioState = 0;
            fireworksTriggered = false;
            document.body.classList.remove("dark-mode");
            mainAudio.pause(); mainAudio.currentTime = 0;
            fireworksAudio.pause(); fireworksAudio.currentTime = 0;
            countdownEl.innerText = "Đang tải...";
        }

        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startFireworks() {
            setInterval(() => {
                let x = Math.random() * canvas.width;
                let y = Math.random() * (canvas.height / 2);
                createFirework(x, y);
            }, 250);
            animateFireworks();
        }

        function createFirework(x, y) {
            let count = 60;
            for (let i = 0; i < count; i++) {
                let angle = (Math.PI * 2 / count) * i;
                let speed = Math.random() * 6 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();

                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }
    </script>
</body>
</html>
