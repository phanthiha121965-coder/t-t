<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngược Tết Đinh Mùi 2027</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Pacifico&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 2px 2px 4px #000;
            letter-spacing: 2px;
            z-index: 10;
        }

        #countdown {
            font-size: 6rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 30px #ff0000, 0 0 10px #ffd700;
            margin: 20px 0;
            z-index: 10;
        }

        .tet-wish {
            font-family: 'Pacifico', cursive;
            font-size: 3.5rem !important;
            color: #ffd700 !important;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ffd700 !important;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        #fireworksCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 5;
        }

        #sound-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(139, 0, 0, 0.98); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #sound-overlay h2 { font-size: 2rem; color: #ffd700; margin-bottom: 25px; text-shadow: 0 0 10px #000; text-align: center; padding: 0 20px; }
        #sound-overlay button {
            padding: 18px 45px; font-size: 1.4rem; font-weight: bold;
            background: linear-gradient(135deg, #ff8c00, #e52d27);
            color: white; border: 2px solid #ffd700; border-radius: 50px;
            cursor: pointer; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .control-panel {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffd700;
            border-radius: 12px; padding: 12px 18px; color: #fff; z-index: 1000; text-align: left;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        .control-panel button { padding: 8px 14px; margin-top: 5px; border-radius: 6px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-test { background-color: #28a745; color: white; }
        .btn-reset { background-color: #dc3545; color: white; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="sound-overlay">
        <h2>🎆 CHÀO MỪNG ĐẾN VỚI ĐẾM NGƯỢC TẾT 2027 🎆</h2>
        <button onclick="enableSound()">🔔 BẬT ÂM THANH & VÀO WEB 🔔</button>
    </div>

    <h1>ĐẾM NGƯỢC TẾT ĐINH MÙI 2027</h1>
    <div id="countdown">Đang tải...</div>

    <canvas id="fireworksCanvas"></canvas>

    <div class="control-panel">
        <h3 style="color: #ffd700; font-size: 0.9rem;">Bảng Thử Nghiệm</h3>
        <button class="btn-test" onclick="testCountdown()">▶ Test Ngay</button>
        <button class="btn-reset" onclick="resetTest()">Reset</button>
    </div>

    <audio id="tetAudio" src="/static/tet.mp3" preload="auto"></audio>

    <script>
        let targetTime = new Date("2027-02-06T00:00:00").getTime();
        
        const tetAudio = document.getElementById("tetAudio");
        const countdownEl = document.getElementById("countdown");
        
        let soundAllowed = false;
        let isTesting = false;
        let fireworksStarted = false;

        function enableSound() {
            document.getElementById("sound-overlay").style.display = "none";
            soundAllowed = true;
            tetAudio.play().then(() => { tetAudio.pause(); tetAudio.currentTime = 0; }).catch(e => {});
        }

        // BÁM SÁT TỪNG MỐC THỜI GIAN TRONG FILE tet.mp3
        tetAudio.ontimeupdate = function() {
            if (!isTesting && !soundAllowed) return;
            
            let t = tetAudio.currentTime;

            if (t < 2.5) {
                countdownEl.className = "";
                countdownEl.innerText = "Sẵn sàng...";
            } else if (t >= 2.5 && t < 3.5) {
                countdownEl.innerText = "5";
            } else if (t >= 3.5 && t < 4.5) {
                countdownEl.innerText = "4";
            } else if (t >= 4.5 && t < 5.5) {
                countdownEl.innerText = "3";
            } else if (t >= 5.5 && t < 6.5) {
                countdownEl.innerText = "2";
            } else if (t >= 6.5 && t < 7.5) {
                countdownEl.innerText = "1";
            } else if (t >= 7.5 && t < 11.2) {
                // Giai đoạn hiện chữ chúc mừng khi đang đọc câu chúc
                countdownEl.className = "tet-wish";
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
            } else if (t >= 11.2) {
                // VỪA DỨT CÂU CHÚC ("MỘT NĂM MỚI BÌNH AN...") -> PHÁO HOA XỊN NỔ RỢP TRỜI NGAY LẬP TỨC!
                if (!fireworksStarted) {
                    fireworksStarted = true;
                    countdownEl.className = "tet-wish";
                    countdownEl.innerText = "CHÚC MỪNG NĂM MỚI 2027!";
                    startFireworks();
                }
            }
        };

        function updateTimer() {
            if (!soundAllowed || isTesting) return;

            let now = new Date().getTime();
            let distance = targetTime - now;

            if (distance <= 0) {
                countdownEl.className = "tet-wish";
                countdownEl.innerText = "CHÚC MỪNG NĂM MỚI!";
                if (!fireworksStarted && tetAudio.paused) {
                    tetAudio.currentTime = 0;
                    tetAudio.play().catch(e => {});
                    isTesting = true;
                }
                return;
            }

            let seconds = Math.floor(distance / 1000);
            
            if (seconds <= 12) {
                if (tetAudio.paused) {
                    tetAudio.currentTime = 0;
                    tetAudio.play().catch(e => {});
                    isTesting = true;
                }
            } else {
                let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let secs = Math.floor((distance % (1000 * 60)) / 1000);
                countdownEl.className = "";
                countdownEl.innerText = `${hours}h ${minutes}m ${secs}s`;
            }
        }

        setInterval(updateTimer, 200);

        function testCountdown() {
            soundAllowed = true;
            document.getElementById("sound-overlay").style.display = "none";
            
            isTesting = true;
            fireworksStarted = false;
            
            tetAudio.currentTime = 0;
            tetAudio.play().catch(e => console.log("Lỗi phát audio"));
            fireworks = [];
            particles = [];
        }

        function resetTest() {
            targetTime = new Date("2027-02-06T00:00:00").getTime();
            isTesting = false;
            fireworksStarted = false;
            tetAudio.pause(); 
            tetAudio.currentTime = 0;
            countdownEl.className = "";
            countdownEl.innerText = "Đang tải...";
            fireworks = [];
            particles = [];
        }

        /* --- HỆ THỐNG PHÁO HOA CỰC KỲ RỰC RỠ & ĐẸP MẮT --- */
        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");
        let fireworks = [];
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.coordinateCount = 4;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.speed = 10;
                this.acceleration = 1.05;
                this.brightness = Math.random() * 30 + 70;
                this.hue = Math.random() * 360;
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.acceleration;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                this.distanceTraveled = Math.hypot(this.x - (this.x + vx), this.y - (this.y + vy));

                if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < this.speed) {
                    fireworks.splice(index, 1);
                    createParticles(this.targetX, this.targetY, this.hue);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = 6;
                while (this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 12 + 2;
                this.friction = 0.94;
                this.gravity = 0.5;
                this.hue = hue + (Math.random() - 0.5) * 40;
                this.brightness = Math.random() * 40 + 60;
                this.alpha = 1;
                this.decay = Math.random() * 0.012 + 0.008;
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;

                if (this.alpha <= 0) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue) {
            let particleCount = 130;
            while (particleCount--) {
                particles.push(new Particle(x, y, hue));
            }
        }

        let timer = 0;
        function startFireworks() {
            animateFireworks();
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';

            let i = fireworks.length;
            while (i--) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }

            let j = particles.length;
            while (j--) {
                particles[j].draw();
                particles[j].update(j);
            }

            if (fireworksStarted) {
                timer++;
                if (timer >= 8) { // Tần suất bắn pháo hoa liên tục, rực rỡ dồn dập
                    fireworks.push(new Firework(Math.random() * canvas.width, canvas.height, Math.random() * canvas.width, Math.random() * (canvas.height * 0.6)));
                    timer = 0;
                }
            }
        }
    </script>
</body>
</html>
